<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Logo Tirage Tarot">
  <defs>
    <linearGradient id="gold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F4D27A"/>
      <stop offset="0.45" stop-color="#E8B84B"/>
      <stop offset="1" stop-color="#B07D22"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B84B"/>
      <stop offset="1" stop-color="#C9962E"/>
    </linearGradient>
    <radialGradient id="cardFace" cx="0.38" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#1c1810"/>
      <stop offset="1" stop-color="#0d0b07"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- fond -->
  <rect width="240" height="240" fill="#0a0a0f"/>

  <!-- cercle fin or (leger relief via double trait) -->
  <circle cx="120" cy="120" r="104" fill="none" stroke="#7a5a18" stroke-width="3"/>
  <circle cx="120" cy="120" r="104" fill="none" stroke="url(#gold)" stroke-width="1.6"/>

  <!-- etoile bagua 8 branches (discret) -->
  <g stroke="#C9962E" stroke-width="1" opacity="0.3">
    <line x1="120" y1="42" x2="120" y2="198"/>
    <line x1="42" y1="120" x2="198" y2="120"/>
    <line x1="64" y1="64" x2="176" y2="176"/>
    <line x1="176" y1="64" x2="64" y2="176"/>
    <line x1="80" y1="48" x2="160" y2="192"/>
    <line x1="48" y1="80" x2="192" y2="160"/>
    <line x1="160" y1="48" x2="80" y2="192"/>
    <line x1="192" y1="80" x2="48" y2="160"/>
  </g>

  <!-- croissant de lune (haut gauche, discret) -->
  <path d="M68 54 a14 14 0 1 0 10 24 a11 11 0 1 1 -10 -24 z"
        fill="none" stroke="#E8B84B" stroke-width="1.3" opacity="0.5"/>

  <!-- carte Tarot centrale (relief : ombre portee + face degradee + bord lumineux) -->
  <g filter="url(#soft)">
    <rect x="98" y="74" width="44" height="92" rx="6"
          fill="url(#cardFace)" stroke="url(#gold)" stroke-width="2"/>
    <!-- bord lumineux haut-gauche (highlight) -->
    <path d="M100 80 L100 160 M100 80 L140 80" stroke="#F4D27A" stroke-width="1" opacity="0.5" fill="none"/>
  </g>

  <!-- trigramme (3 lignes) en haut de la carte, leger relief -->
  <g fill="url(#goldSoft)">
    <rect x="106" y="84" width="28" height="2.6" rx="1.3"/>
    <rect x="106" y="90.5" width="12" height="2.6" rx="1.3"/>
    <rect x="122" y="90.5" width="12" height="2.6" rx="1.3"/>
    <rect x="106" y="97" width="28" height="2.6" rx="1.3"/>
  </g>

  <!-- rune ᚠ gravee au centre (ombre interne legere) -->
  <g stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round" fill="none">
    <line x1="120" y1="110" x2="120" y2="152"/>
    <line x1="120" y1="119" x2="135" y2="125"/>
    <line x1="120" y1="132" x2="135" y2="138"/>
  </g>
  <line x1="120" y1="110" x2="120" y2="152" stroke="#7a5a18" stroke-width="0.6" opacity="0.5"/>

  <!-- base de carte : ligne decorative -->
  <line x1="106" y1="160" x2="134" y2="160" stroke="#C9962E" stroke-width="1" opacity="0.55"/>
</svg>
