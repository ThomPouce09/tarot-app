name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8.x exige Node >=22 (fatal sinon)
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Setup Java 21
        # Capacitor 8 / AGP 8.13 (compileSdk 36) compile en Java 21 —
        # un JDK 17 lève « invalid source release: 21 » sur :capacitor-android.
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore debug keystore (signature stable)
        # SANS ceci, AGP auto-génère un keystore debug DIFFERENT sur chaque
        # runner → signature différente à chaque build → Android refuse la
        # mise à jour par-dessus l'app installée (obligation de désinstaller).
        # Le secret DEBUG_KEYSTORE_B64 (PKCS12, alias androiddebugkey, mots de
        # passe « android ») est restauré à l'emplacement standard ~/.android/
        # debug.keystore → signingConfigs.debug le pickera → tous les builds
        # partagent la même clé → vraies mises à jour in-place.
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            mkdir -p ~/.android
            echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
            echo "debug.keystore restauré ✓ (signature stable)"
          else
            echo "::warning::DEBUG_KEYSTORE_B64 absent — signature aléatoire, les mises à jour in-place échoueront"
          fi

      - name: Inject google-services.json (Firebase)
        # Le repo est PUBLIC et google-services.json est gitignoré → le runner
        # ne l'a pas. On le reconstruit depuis le secret GOOGLE_SERVICES_JSON
        # (contenu JSON encodé en base64, ajouté dans Settings → Secrets).
        # Sans lui, le plugin com.google.gms.google-services ne s'applique pas
        # et les notifications FCM ne fonctionneraient pas dans l'APK.
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
            echo "google-services.json injecté ✓"
          else
            echo "::warning::GOOGLE_SERVICES_JSON non défini — APK sans Firebase (FCM inopérant)"
          fi

      - name: Capacitor sync
        # Le projet Android est DÉJÀ initialisé et versionné (capacitor.config.ts
        # + android/). `cap init`/`cap add android` écraseraient la config ou
        # bloqueraient en non-interactif — seul `cap sync` copie le build web
        # (out/) vers android/app/src/main/assets/public.
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tarot-app-apk
          path: android/app/build/outputs/apk/release/*.apk
