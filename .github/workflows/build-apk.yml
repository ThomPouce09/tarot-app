name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8.x exige Node >=22 (fatal sinon)
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Setup Java 21
        # Capacitor 8 / AGP 8.13 (compileSdk 36) compile en Java 21 —
        # un JDK 17 lève « invalid source release: 21 » sur :capacitor-android.
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor sync
        # Le projet Android est DÉJÀ initialisé et versionné (capacitor.config.ts
        # + android/). `cap init`/`cap add android` écraseraient la config ou
        # bloqueraient en non-interactif — seul `cap sync` copie le build web
        # (out/) vers android/app/src/main/assets/public.
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tarot-app-apk
          path: android/app/build/outputs/apk/release/*.apk
