name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8.x exige Node >=22 (fatal sinon)
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Setup Java 21
        # Capacitor 8 / AGP 8.13 (compileSdk 36) compile en Java 21 —
        # un JDK 17 lève « invalid source release: 21 » sur :capacitor-android.
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore debug keystore (signature stable)
        # SANS ceci, AGP auto-génère un keystore debug DIFFERENT sur chaque
        # runner → signature différente à chaque build → Android refuse la
        # mise à jour par-dessus l'app installée (obligation de désinstaller).
        # Piège rencontré : placer le PKCS12 dans ~/.android/debug.keystore NE
        # marche PAS — AGP attend du JKS là, invalide le fichier et régénère une
        # clé en silence. D'où le chemin explicite android/app/debug.keystore,
        # référencé par signingConfigs.stable dans app/build.gradle.
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > android/app/debug.keystore
            echo "debug.keystore restauré ✓ (signature stable)"
          else
            echo "::error::DEBUG_KEYSTORE_B64 absent — le build Gradle échouera (pas de repli sur une clé aléatoire)"
            exit 1
          fi

      - name: Inject google-services.json (Firebase)
        # Le repo est PUBLIC et google-services.json est gitignoré → le runner
        # ne l'a pas. On le reconstruit depuis le secret GOOGLE_SERVICES_JSON
        # (contenu JSON encodé en base64, ajouté dans Settings → Secrets).
        # Sans lui, le plugin com.google.gms.google-services ne s'applique pas
        # et les notifications FCM ne fonctionneraient pas dans l'APK.
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
            echo "google-services.json injecté ✓"
          else
            echo "::warning::GOOGLE_SERVICES_JSON non défini — APK sans Firebase (FCM inopérant)"
          fi

      - name: Capacitor sync
        # Le projet Android est DÉJÀ initialisé et versionné (capacitor.config.ts
        # + android/). `cap init`/`cap add android` écraseraient la config ou
        # bloqueraient en non-interactif — seul `cap sync` copie le build web
        # (out/) vers android/app/src/main/assets/public.
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Vérifier la signature (clé stable)
        # Échoue le build si l'APK n'est PAS signé avec la clé attendue —
        # empêche la diffusion d'un APK qui casserait les mises à jour in-place.
        # SHA-256 du cert : e9e2aace… (SHA-1) / 0fe6c97c… (SHA-256), debug.keystore stable.
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" > /tmp/sig.txt
          if grep -qi "0fe6c97cdf1709ce7350a915298974a1c90b9c497b3809a8e8c63ae7a2210f03" /tmp/sig.txt; then
            echo "signature stable vérifiée ✓"
          else
            echo "::error::Signature ≠ clé stable attendue — voir ci-dessous"
            cat /tmp/sig.txt
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tarot-app-apk
          path: android/app/build/outputs/apk/release/*.apk
